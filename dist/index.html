<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="胡志彬的数字媒体艺术作品集，包含特效、三维建模、AIGC、剪辑与游戏制作。" />
    <meta name="theme-color" content="#0f172a" />
    <title>胡志彬｜数字媒体艺术作品集</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#portfolio">跳到作品</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="wordmark" href="#home" aria-label="返回首页">Portfolio</a>
        <button class="nav-toggle" id="nav-toggle" type="button" aria-label="展开导航" aria-expanded="false" aria-controls="main-nav">☰</button>
        <nav class="main-nav" id="main-nav" aria-label="作品分类">
          <a class="active" href="#home">首页</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero" id="home" aria-labelledby="profile-name">
        <p class="eyebrow" id="profile-title">数字媒体艺术专业</p>
        <h1 id="profile-name">胡志彬</h1>
        <p class="hero-bio" id="profile-bio">数字媒体艺术专业27年毕业学生，就读于首都师范大学科德学院，本科毕业。欢迎您查看我的作品集网站。</p>
        <a class="contact-button" id="hero-contact" href="mailto:2291177827@qq.com"><span aria-hidden="true">✉</span> 联系我</a>
      </section>

      <section class="profile-card" aria-label="个人介绍">
        <img class="profile-avatar" id="profile-avatar" src="./assets/avatar.jpg" alt="胡志彬的头像" />
        <div class="profile-card-copy">
          <h2 id="card-name">胡志彬</h2>
          <p id="card-bio">数字媒体艺术专业27年毕业学生，就读于首都师范大学科德学院，本科毕业。欢迎您查看我的作品集网站。</p>
          <div class="contact-list" id="contact-list"></div>
          <div class="social-list" id="social-list"></div>
        </div>
      </section>

      <section class="portfolio" id="portfolio" aria-labelledby="portfolio-title">
        <h2 class="sr-only" id="portfolio-title">分类作品</h2>
        <div id="category-sections"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <span id="footer-year"></span> <span id="footer-name">胡志彬</span> · Portfolio</p>
    </footer>

    <dialog class="work-dialog" id="work-dialog" aria-labelledby="dialog-title">
      <form method="dialog"><button class="dialog-close" type="submit" aria-label="关闭">×</button></form>
      <div class="dialog-content">
        <header class="dialog-header">
          <p class="dialog-meta"><span id="dialog-category"></span><span id="dialog-date"></span></p>
          <h2 id="dialog-title"></h2>
          <p id="dialog-description"></p>
          <div class="tag-list" id="dialog-tags"></div>
        </header>
        <div class="media-gallery" id="dialog-media"></div>
        <div class="file-list" id="dialog-files"></div>
      </div>
    </dialog>

    <div class="loading-state" id="loading-state" role="status">正在加载作品…</div>
    <script src="./app.js" defer></script>
  </body>
</html>
